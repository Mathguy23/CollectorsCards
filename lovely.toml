            end
        end
        for k=1, #G.hand.cards do
            local eval = G.hand.cards[k]:calculate_exotic({cardarea = context.cardarea, full_hand = G.play.cards, scoring_hand = context.scoring_hand, scoring_name = context.scoring_name, poker_hands = context.poker_hands, other_card = card, individual = true}, {})
            if eval then 
                for l = 1, #eval do
                    table.insert(new_table, eval[l])
                end
            end
        end
        local exotic_eval = card:calculate_exotic({cardarea = context.cardarea, full_hand = G.play.cards, scoring_hand = context.scoring_hand, scoring_name = context.scoring_name, poker_hands = context.poker_hands, playing_card_hand = (context.cardarea == G.hand), playing_card_main = (context.cardarea == G.play)})
        if exotic_eval then
            for l = 1, #exotic_eval do
                table.insert(new_table, exotic_eval[l])
            end
        end
    end
    if context.end_of_round and (context.cardarea == G.hand) and not context.individual and not context.repetition and not context.playing_card_end_of_round then
        for k=1, #G.hand.cards do
            local eval = G.hand.cards[k]:calculate_exotic({cardarea = context.cardarea, other_card = card, individual = true, end_of_round = true}, {})
            if eval and next(eval) then 
                for l = 1, #eval do
                    table.insert(new_table, eval[l])
                end
            end
        end
        local exotic_eval = card:calculate_exotic({cardarea = context.cardarea, end_of_round = true, game_over = context.game_over})
        if exotic_eval then
            for l = 1, #exotic_eval do
                table.insert(new_table, exotic_eval[l])
            end
        end
    end
    if next(new_table) then
        effects[1]['trading_cards'] = new_table
    end
    return unpack(effects)
end'''
